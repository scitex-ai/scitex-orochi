name: auto-merge-to-develop
# Merge green PRs that TARGET develop, the moment their checks complete.
# GitHub reads check_suite-triggered workflows from the DEFAULT branch (main),
# so this file lives on main but acts ONLY on PRs whose base is develop.
# codecov + readthedocs checks are ignored (advisory). Fail-safe: if a merge
# is blocked by branch policy the PR simply stays open.
#
# Reusable-workflow migration (2026-07-10 incident remediation, PR #69
# pattern): the job body now lives at scitex-ai/.github, centralizing the
# logic across the fleet instead of per-repo copies drifting apart. This
# file MUST stay on the default branch (main) — GitHub reads check_suite
# triggers from there — only the jobs: body changed in place.
on:
  check_suite:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/auto-merge-to-develop.yml@main
    secrets: inherit
