name: CLA Assistant

# Two trigger paths:
#   1. PRs from contributors           → CLAssistant action checks signature.
#                                         allowlist already short-circuits to
#                                         success for `bot*` and the repo
#                                         owner, so owner PRs land instantly.
#   2. Direct pushes / tag pushes      → owner-bypass job posts a synthetic
#      by the repo owner                  `CLAssistant=success` status on the
#                                         SHA so the release pipeline's
#                                         sync-main step (a direct ref PATCH)
#                                         doesn't get rejected by main's
#                                         branch-protection rule that requires
#                                         CLAssistant. Operator-direct: 2026-06-04.
#
# Reusable-workflow migration (2026-07-10 incident remediation, PR #69
# pattern): both jobs now live at scitex-ai/.github/cla.yml. This repo's
# allowlist/default-branch/owner-login already match the reusable's
# defaults (bot*,ywatanabe1989 / main / ywatanabe1989), so no `with:`
# override is needed.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    secrets: inherit
