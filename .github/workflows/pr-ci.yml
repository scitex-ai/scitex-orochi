name: pr-ci

# Consolidated PR-only CI gate. Runs the per-PR validation suite as a
# single workflow so the cancel-in-progress concurrency group, path
# filters, and uv cache apply uniformly. Post-merge validation lives
# in release-ci.yml.
#
# L1 concurrency — cancel superseded PR runs.
# L3 path filters — skip docs/skills/examples/markdown-only PRs.
# L4 conditional matrix — full ["3.11", "3.12", "3.13"] on PR (this trigger).
# L5a uv-managed Python (`uv python install` + `uv venv --python`) so the
#     matrix leg is not bound to the runner's system Python.
# L5b .venv/bin on PATH (and explicit `.venv/bin/python` for clarity) so
#     console scripts resolve without needing `uv run`.
#
# Reusable-workflow migration (2026-07-10 incident remediation, PR #69
# pattern): only `tests` below converts to the centralized pytest-matrix
# body (functionally equivalent on the pull_request trigger — always the
# full 3-version matrix). `import-smoke` here is NOT converted: it
# additionally smokes the `scitex-orochi --help` CLI entrypoint and the
# `scitex-orochi-mcp`/`scitex-orochi-server` daemon entrypoints, which the
# generic import-smoke.yml reusable does not cover — converting would
# silently drop that PR-gating signal. `dep-hygiene-smoke` has no
# reusable-workflow counterpart. `audit` is NOT converted for the same
# reason as release-ci.yml (raw audit-all vs the canonical
# tests/develop/test_audit.py gate, PR #436) — this one gates PR merges,
# so a false-positive flood here would be worse than in release-ci.yml.

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '_skills/**'
      - 'examples/**'
      - '**.md'
      - 'CHANGELOG.*'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  import-smoke:
    name: import-smoke-on-ubuntu-py3-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.12 (uv-managed)
        run: uv python install 3.12
      # The bare-install import contract (`import scitex_orochi` with NO
      # extras) is covered by the dep-hygiene-smoke job below. Here we
      # install `[all]` so the MCP entrypoint's optional dep (fastmcp) is
      # importable for the presence check.
      - name: Install with extras in uv venv
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[all]" \
            || uv pip install --python .venv/bin/python -e .
      - name: Import smoke
        run: .venv/bin/python -c "import scitex_orochi; print(getattr(scitex_orochi, '__version__', 'unversioned'))"
      # Only `scitex-orochi` is a Click CLI with a `--help` short-circuit.
      - name: smoke scitex-orochi --help
        run: .venv/bin/scitex-orochi --help
      # `scitex-orochi-mcp` and `scitex-orochi-server` are daemon launchers:
      # their `main()` boots the server (stdio MCP loop / DB open + socket
      # bind) on ANY invocation — neither has a `--help` short-circuit, so
      # `--help` would start (and in CI hang or crash on the unwritable DB
      # path) rather than print help. Smoke that the console scripts are
      # installed and their entrypoints importable, not that they boot.
      - name: smoke daemon entrypoints present
        run: |
          test -x .venv/bin/scitex-orochi-mcp
          test -x .venv/bin/scitex-orochi-server
          .venv/bin/python -c "from scitex_orochi.mcp_server import main as m; from scitex_orochi._server import main as s; assert callable(m) and callable(s)"
  dep-hygiene-smoke:
    name: dep-hygiene-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.11 (uv-managed)
        run: uv python install 3.11
      - name: Bare install (no extras) in uv venv
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python .
      - name: Import package
        run: .venv/bin/python -c "import scitex_orochi; print(scitex_orochi.__name__)"

  pytest-matrix:
    # New required-status-check context: "pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>"
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.12 (uv-managed)
        run: uv python install 3.12
      - name: Install package + audit tooling
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          uv pip install --python .venv/bin/python "scitex-dev[cli-audit]"
      # Run the package's canonical audit gate, NOT raw `audit-all`.
      # `tests/develop/test_audit.py::test_audit_all_clean` is the single
      # source of truth for this package's formally-deferred audit rules
      # (the CLI/MCP noun-verb migration §1/§1a/§1d/§2/§4/§5/§6/§6b/§10 +
      # the PA-306/307 test-hygiene backlog, each documented in-file).
      # Raw `audit-all` bypasses that mask and cannot load the `deferred`
      # opt-out on the runner, re-firing already-deferred findings. See PR #436.
      - name: Run audit conformance gate
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/pytest tests/develop/test_audit.py -v
